<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Light theme cube - metal finishes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    /* The page background is the landing page's light hero (globals.css,
       html.light .landing-hero). The canvas is transparent, as on the site. */
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; color: #1b2c25;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 85% 15%, rgba(141,174,149,.24), transparent 55%), #e7ede8; }
    body.dark { background: #000; color: #f2f2f2; }
    #stage { position: fixed; inset: 0; }
    .bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex;
      gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; padding: 8px 12px;
      border-radius: 16px; font-size: 12px; background: rgba(244,247,242,.9);
      border: 1px solid rgba(53,75,64,.2); box-shadow: 0 10px 30px -10px rgba(27,44,37,.18);
      max-width: calc(100% - 24px); }
    .bar button { border: 0; border-radius: 10px; padding: 6px 10px; font-size: 12px;
      font-weight: 500; cursor: pointer; background: rgba(27,44,37,.06); color: inherit; }
    .bar button.on { background: #1b2c25; color: #f4f7f2; }
    .hud { position: fixed; top: 14px; left: 14px; font-size: 12px; padding: 6px 12px;
      border-radius: 999px; background: rgba(244,247,242,.9); border: 1px solid rgba(53,75,64,.2);
      font-variant-numeric: tabular-nums; }
    body.dark .bar, body.dark .hud { background: rgba(16,16,16,.8); border-color: rgba(255,255,255,.12); }
    body.dark .bar button { background: rgba(255,255,255,.08); }
    body.dark .bar button.on { background: #00d992; color: #050507; }
    body.bare .bar, body.bare .hud { display: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div class="hud"><span id="clock">0.0s</span> &middot; <span id="finish">Pewter</span></div>
  <div class="bar">
    <button id="play" class="on">Pause</button>
    <span style="opacity:.3">|</span>
    <button class="tone on" data-tone="pewter">Pewter</button>
    <button class="tone" data-tone="sage">Sage steel</button>
    <button class="tone" data-tone="emerald">Emerald anodised</button>
    <button class="tone" data-tone="graphite">Graphite</button>
    <button class="tone" data-tone="dark">Dark theme</button>
  </div>
  <script>
  (function () {
    // ── Motion: identical to light_theme_cube_exact.html ──────────────────────
    // Read from the Resend hero's Spline scene and checked against cube.mp4
    // (~88% silhouette overlap). Whole cube -359 deg per 10 s at constant speed;
    // left slice half-turns (2 s, at 1.5 s then every 5 s); right slice (3 s, at
    // 2.5 s then every 8 s); cubic-bezier(0.42, 0, 0.58, 1). Loops every 80 s.
    const SPIN_PERIOD = 10.0, SPIN_TOTAL = -359 * Math.PI / 180, LOOP = 80.0;
    const SLICES = {
      '-1': { delay: 1.5, every: 5.0, dur: 2.0 },
      '1':  { delay: 2.5, every: 8.0, dur: 3.0 }
    };
    function bezier(x1, y1, x2, y2) {
      const ax = 1 - 3 * x2 + 3 * x1, bx = 3 * x2 - 6 * x1, cx = 3 * x1;
      const ay = 1 - 3 * y2 + 3 * y1, by = 3 * y2 - 6 * y1, cy = 3 * y1;
      const sx = (t) => ((ax * t + bx) * t + cx) * t;
      const sy = (t) => ((ay * t + by) * t + cy) * t;
      return (x) => {
        if (x <= 0) return 0;
        if (x >= 1) return 1;
        let lo = 0, hi = 1, t = x;
        for (let i = 0; i < 48; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
        return sy(t);
      };
    }
    const ease = bezier(0.42, 0, 0.58, 1);
    function sliceAngle(t, s) {
      if (t < s.delay) return 0;
      const n = Math.floor((t - s.delay) / s.every);
      const local = t - s.delay - n * s.every;
      const p = local < s.dur ? ease(local / s.dur) : 1;
      const from = n % 2 === 0 ? 0 : -Math.PI;
      const to = n % 2 === 0 ? -Math.PI : 0;
      return from + (to - from) * p;
    }
    const spinAngle = (t) => SPIN_TOTAL * ((t % SPIN_PERIOD) / SPIN_PERIOD);

    // ── Renderer: transparent canvas over the page background ─────────────────
    const stage = document.getElementById('stage');
    const params = new URLSearchParams(location.search);
    if (params.get('ui') === '0') document.body.classList.add('bare');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.physicallyCorrectLights = true;
    stage.appendChild(renderer.domElement);
    const scene = new THREE.Scene();

    // ── Camera: orthographic isometric, scale matched to cube.mp4 ─────────────
    const HALF_H = 3.125;
    const camera = new THREE.OrthographicCamera(-HALF_H, HALF_H, HALF_H, -HALF_H, 0.1, 100);
    camera.position.set(10, 10, 10);
    camera.lookAt(0, 0, 0);
    camera.updateMatrixWorld(true);
    function fit() {
      const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight;
      const a = w / h;
      camera.left = -HALF_H * a; camera.right = HALF_H * a;
      camera.top = HALF_H; camera.bottom = -HALF_H;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    addEventListener('resize', fit);
    fit();

    // ── Studio reflections ────────────────────────────────────────────────────
    // Metal is mostly reflection, so the look is decided by what it reflects.
    // The original has a near-black studio with a few hard softboxes; the faces
    // that catch a softbox go bright and the rest stay dark. That contrast is
    // what reads as "metal". On a light page we keep the hard softboxes and
    // tint the dark studio toward the page colour, so the cube belongs there.
    const pmrem = new THREE.PMREMGenerator(renderer);
    function studio(top, mid, floor, boxes) {
      const W = 1024, H = 512;
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, top); g.addColorStop(0.5, mid); g.addColorStop(1, floor);
      x.fillStyle = g; x.fillRect(0, 0, W, H);
      // softboxes: [centre x 0-1, centre y 0-1, width, height, colour]
      // Hard-edged boxes: a blurred box gives a soft glow on the metal, a hard
      // one gives the crisp streak the original shows.
      for (const [cx, cy, w, h, col] of boxes) {
        x.fillStyle = col;
        x.fillRect((cx - w / 2) * W, (cy - h / 2) * H, w * W, h * H);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.mapping = THREE.EquirectangularReflectionMapping;
      tex.encoding = THREE.sRGBEncoding;
      const env = pmrem.fromEquirectangular(tex).texture;
      tex.dispose();
      return env;
    }

    // ── Surface detail ────────────────────────────────────────────────────────
    function canvasTex(size, draw, repeat) {
      const c = document.createElement('canvas'); c.width = c.height = size;
      draw(c.getContext('2d'), size);
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      if (repeat) t.repeat.set(repeat, repeat);
      t.anisotropy = 8;
      return t;
    }
    // Brushed metal: fine horizontal streaks in the roughness, so highlights
    // smear sideways the way they do on a brushed face.
    const brushed = canvasTex(512, (x, s) => {
      x.fillStyle = '#8a8a8a'; x.fillRect(0, 0, s, s);
      for (let i = 0; i < 2600; i++) {
        const v = 110 + Math.floor(Math.random() * 70);
        x.fillStyle = `rgba(${v},${v},${v},0.55)`;
        x.fillRect(Math.random() * s, Math.random() * s, 40 + Math.random() * 220, 1);
      }
    });
    // Perforated mesh: a hole grid, used as a bump map.
    const perforated = canvasTex(256, (x, s) => {
      x.fillStyle = '#fff'; x.fillRect(0, 0, s, s);
      for (let yy = 8; yy < s; yy += 16) for (let xx = 8; xx < s; xx += 16) {
        const g = x.createRadialGradient(xx, yy, 0.5, xx, yy, 4.6);
        g.addColorStop(0, '#111'); g.addColorStop(0.7, '#444'); g.addColorStop(1, '#fff');
        x.fillStyle = g; x.beginPath(); x.arc(xx, yy, 4.6, 0, Math.PI * 2); x.fill();
      }
    });

    // Four tile finishes, like the original: polished, satin, brushed, mesh.
    // Colours and roughness come from the active finish (see FINISHES).
    const M = {
      // Low roughness is what makes metal read as metal: a sharp softbox streak
      // on one tile next to a dark one. At 0.3+ the reflections smear into an
      // even grey and the cube looks painted (the first render did exactly that).
      body:     new THREE.MeshStandardMaterial({ metalness: 0.7, roughness: 0.45 }),
      polished: new THREE.MeshPhysicalMaterial({ metalness: 1, roughness: 0.03, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.9 }),
      satin:    new THREE.MeshStandardMaterial({ metalness: 1, roughness: 0.14, envMapIntensity: 1.7 }),
      brushed:  new THREE.MeshStandardMaterial({ metalness: 1, roughness: 0.3, roughnessMap: brushed, envMapIntensity: 1.7 }),
      mesh:     new THREE.MeshStandardMaterial({ metalness: 0.95, roughness: 0.28, bumpMap: perforated, bumpScale: 0.035, envMapIntensity: 1.5 })
    };

    // ── Cube: outer (spins about x) > inner (about y) > 3 slices > 9 cubies ───
    const CELL = 1.0, SIZE = 0.93;
    function roundedBox(size, radius, smooth) {
      const shape = new THREE.Shape(), r = radius - 1e-5, h = size / 2 - radius;
      shape.absarc(-h, -h, r, Math.PI, Math.PI * 1.5, false);
      shape.absarc(h, -h, r, Math.PI * 1.5, Math.PI * 2, false);
      shape.absarc(h, h, r, 0, Math.PI * 0.5, false);
      shape.absarc(-h, h, r, Math.PI * 0.5, Math.PI, false);
      const g = new THREE.ExtrudeGeometry(shape, { depth: size - radius * 2, bevelEnabled: true,
        bevelSegments: smooth * 2, steps: 1, bevelSize: r, bevelThickness: radius, curveSegments: smooth });
      g.center();
      return g;
    }
    const bodyGeo = roundedBox(SIZE, 0.07, 4);
    // Tiles are thin rounded slabs, not flat planes, so each has a lit edge.
    const tileGeo = roundedBox(0.8, 0.05, 3);
    tileGeo.scale(1, 1, 0.06 / 0.8);
    const FACES = [
      { d: [1, 0, 0], r: [0, Math.PI / 2, 0] }, { d: [-1, 0, 0], r: [0, -Math.PI / 2, 0] },
      { d: [0, 1, 0], r: [-Math.PI / 2, 0, 0] }, { d: [0, -1, 0], r: [Math.PI / 2, 0, 0] },
      { d: [0, 0, 1], r: [0, 0, 0] }, { d: [0, 0, -1], r: [0, Math.PI, 0] }
    ];
    function pick(ix, iy, iz, f) {
      const h = Math.abs((ix + 2) * 7 + (iy + 2) * 13 + (iz + 2) * 19 + f * 23) % 10;
      if (h === 0 || h === 5) return M.mesh;
      if (h === 1 || h === 4 || h === 8) return M.polished;
      if (h === 2 || h === 6) return M.brushed;
      return M.satin;
    }
    const outer = new THREE.Group(), inner = new THREE.Group();
    scene.add(outer); outer.add(inner);
    const slices = {};
    for (const sx of [-1, 0, 1]) {
      const g = new THREE.Group(); g.position.set(sx * CELL, 0, 0);
      inner.add(g); slices[sx] = g;
      for (const y of [-1, 0, 1]) for (const z of [-1, 0, 1]) {
        const cub = new THREE.Group(); cub.position.set(0, y * CELL, z * CELL);
        cub.add(new THREE.Mesh(bodyGeo, M.body));
        FACES.forEach((fc, fi) => {
          const out = (fc.d[0] === 1 && sx === 1) || (fc.d[0] === -1 && sx === -1) ||
            (fc.d[1] === 1 && y === 1) || (fc.d[1] === -1 && y === -1) ||
            (fc.d[2] === 1 && z === 1) || (fc.d[2] === -1 && z === -1);
          if (!out) return;
          const tile = new THREE.Mesh(tileGeo, pick(sx, y, z, fi));
          const off = SIZE / 2 + 0.012;
          tile.position.set(fc.d[0] * off, fc.d[1] * off, fc.d[2] * off);
          tile.rotation.set(fc.r[0], fc.r[1], fc.r[2]);
          cub.add(tile);
        });
        g.add(cub);
      }
    }

    // ── Lights, placed relative to the camera so they hold as the cube turns ──
    const cm = camera.matrixWorld.elements;
    const R = new THREE.Vector3(cm[0], cm[1], cm[2]), U = new THREE.Vector3(cm[4], cm[5], cm[6]);
    const B = new THREE.Vector3(cm[8], cm[9], cm[10]);
    const at = (back, up, right) => B.clone().multiplyScalar(back).add(U.clone().multiplyScalar(up)).add(R.clone().multiplyScalar(right));
    const key = new THREE.DirectionalLight(0xffffff, 3);  key.position.copy(at(5, 6, -6));   // upper left, like the video
    const rim = new THREE.DirectionalLight(0xffffff, 1.5); rim.position.copy(at(-6, 3, 6));  // behind, right edge
    const fill = new THREE.HemisphereLight(0xffffff, 0x000000, 0.4);
    // A close point light, up and to the left: its falloff puts a gradient
    // across each face, so tiles near it glow and far ones drop off, as in the
    // video. Directional lights alone light a whole face evenly.
    const glow = new THREE.PointLight(0xffffff, 40, 0, 2);
    glow.position.copy(at(3.2, 2.6, -2.4));
    scene.add(key, rim, fill, glow);

    // ── Finishes ──────────────────────────────────────────────────────────────
    // tile: colour of the four tile finishes; body: the cubie behind them (the
    // dark gaps); env: reflected studio [top, middle, floor]; boxes: softboxes.
    // Bigger boxes spread across the sphere, so most tile angles catch one at
    // some point in the turn, with dark gaps between so others go dark.
    const WHITE_BOXES = [
      [0.12, 0.32, 0.10, 0.38, '#ffffff'], [0.30, 0.26, 0.14, 0.30, '#ffffff'],
      [0.50, 0.40, 0.06, 0.50, '#f4f7f2'], [0.68, 0.30, 0.16, 0.24, '#ffffff'],
      [0.88, 0.36, 0.08, 0.40, '#e8efe9'], [0.40, 0.72, 0.30, 0.04, '#cfdad2']
    ];
    const FINISHES = {
      // Darker studio middles than the page: the tile colour comes through in
      // the dark reflections, the softboxes give the bright streaks.
      pewter:   { label: 'Pewter', tile: 0xc4cacd, body: 0x24292b, env: ['#7d8883', '#2c3431', '#0f1412'],
                  boxes: WHITE_BOXES, exposure: 1.0, key: 2.2, rim: 1.2 },
      sage:     { label: 'Sage steel', tile: 0xb2c8b8, body: 0x1f2a24, env: ['#80958a', '#2b3a32', '#0e1813'],
                  boxes: WHITE_BOXES, exposure: 1.0, key: 2.2, rim: 1.2 },
      emerald:  { label: 'Emerald anodised', tile: 0x2fa37b, body: 0x0a2018, env: ['#6f9583', '#21392e', '#0a1712'],
                  boxes: WHITE_BOXES, exposure: 1.05, key: 2.4, rim: 1.4 },
      graphite: { label: 'Graphite', tile: 0x5a605d, body: 0x0e1110, env: ['#4a5450', '#141917', '#030404'],
                  boxes: WHITE_BOXES, exposure: 1.1, key: 2.6, rim: 1.6 },
      dark:     { label: 'Dark theme', tile: 0x26292c, body: 0x0b0c0d, env: ['#1a1d1f', '#060708', '#000000'],
                  boxes: [[0.30, 0.30, 0.10, 0.34, '#ffffff'], [0.80, 0.34, 0.10, 0.26, '#cfd6d2']],
                  exposure: 1.2, key: 3.6, rim: 2.0, page: 'dark' }
    };
    const envCache = {};
    function applyFinish(name) {
      const f = FINISHES[name] || FINISHES.pewter;
      document.body.classList.toggle('dark', f.page === 'dark');
      envCache[name] = envCache[name] || studio(f.env[0], f.env[1], f.env[2], f.boxes);
      scene.environment = envCache[name];
      renderer.toneMappingExposure = f.exposure;
      key.intensity = f.key; rim.intensity = f.rim;
      glow.intensity = f.glow != null ? f.glow : 40;
      M.body.color.setHex(f.body);
      // Each finish gets its own tone, so tiles on one face differ the way the
      // original's do: polished reads as a dark mirror, satin is the light one,
      // brushed sits between, mesh is darkest.
      const TONE = { polished: 0.55, satin: 1.0, brushed: 0.82, mesh: 0.5 };
      for (const k of Object.keys(TONE)) M[k].color.setHex(f.tile).multiplyScalar(TONE[k]);
      document.getElementById('finish').textContent = f.label;
    }
    document.querySelectorAll('.tone').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('.tone').forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      applyFinish(b.dataset.tone);
    }));

    // ── Pose and loop ─────────────────────────────────────────────────────────
    function setPose(t) {
      const a = spinAngle(t);
      outer.rotation.set(a, 0, 0);
      inner.rotation.set(0, a, 0);
      for (const k of [-1, 1]) slices[k].rotation.set(sliceAngle(t, SLICES[k]), 0, 0);
    }
    let playing = true, t = 0, last = performance.now();
    const clockEl = document.getElementById('clock');
    document.getElementById('play').addEventListener('click', (e) => {
      playing = !playing;
      e.target.textContent = playing ? 'Pause' : 'Play';
      e.target.classList.toggle('on', playing);
    });
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      if (playing) t = (t + dt) % LOOP;
      setPose(t);
      clockEl.textContent = t.toFixed(1) + 's';
      renderer.render(scene, camera);
    }

    // Capture hooks: freeze at scene time tau / switch finish, then draw once.
    window.__seek = (tau) => { playing = false; t = ((tau % LOOP) + LOOP) % LOOP; setPose(t); renderer.render(scene, camera); };
    window.__finish = (name) => { applyFinish(name); renderer.render(scene, camera); };

    applyFinish(params.get('tone') || 'pewter');
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
